<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB: Q - 임상병리 국가고시</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6fb;
            color: #20232a;
        }
        button, input { font-family: inherit; }
        button { cursor: pointer; }
        .app {
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background: #ffffff;
            overflow: hidden;
        }
        header {
            padding: 22px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: #667eea; }
        .header-right { display: flex; gap: 8px; }
        .header-btn {
            border: none;
            background: #f1f3f8;
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 700;
        }
        .screen { display: none; padding-bottom: 40px; }
        .screen.active { display: block; }
        .section-title { font-size: 20px; font-weight: 800; margin: 28px 0 14px; }
        .section-subtitle { font-size: 13px; color: #8b909c; margin-top: -7px; margin-bottom: 15px; }
        .hero {
            margin: 20px;
            padding: 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        .hero-small { font-size: 12px; font-weight: 700; opacity: 0.8; letter-spacing: 1px; }
        .hero h1 { margin: 10px 0 8px; font-size: 25px; line-height: 1.35; }
        .hero p { margin: 0; font-size: 14px; opacity: 0.9; }
        .daily-info {
            margin-top: 20px;
            background: rgba(255,255,255,0.15);
            padding: 14px;
            border-radius: 15px;
        }
        .daily-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
        .daily-bar {
            width: 100%; height: 7px;
            background: rgba(255,255,255,0.25);
            border-radius: 20px; overflow: hidden;
        }
        .daily-bar-fill { height: 100%; width: 0%; background: white; border-radius: 20px; }
        .quick-start {
            margin-top: 15px; width: 100%; border: none;
            background: white; color: #667eea;
            font-weight: 800; padding: 13px; border-radius: 13px;
        }
        .search-box { margin: 0 20px; position: relative; }
        .search-box input {
            width: 100%; padding: 14px 16px;
            border: 1px solid #e4e7ee; border-radius: 14px;
            outline: none; font-size: 14px; background: #fafbfe;
        }
        .search-box input:focus { border-color: #667eea; }
        .subjects { padding: 0 20px; }
        .subject-card {
            width: 100%; border: 1px solid #e9ebf1;
            background: white; border-radius: 20px;
            padding: 18px; margin-bottom: 12px;
            text-align: left; transition: 0.15s;
        }
        .subject-card:hover { transform: translateY(-2px); box-shadow: 0 7px 18px rgba(0,0,0,0.06); }
        .subject-header { display: flex; align-items: center; gap: 13px; }
        .subject-icon {
            width: 48px; height: 48px; border-radius: 15px;
            background: #f0f2ff; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
        }
        .subject-name { font-size: 17px; font-weight: 800; }
        .subject-desc { font-size: 12px; color: #9297a3; margin-top: 4px; }
        .progress-info {
            display: flex; justify-content: space-between;
            margin-top: 15px; font-size: 11px; color: #8d929d;
        }
        .progress { height: 6px; background: #edf0f5; border-radius: 20px; margin-top: 7px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: #667eea; border-radius: 20px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px; }
        .menu-card { border: none; background: #f7f8fc; border-radius: 18px; padding: 18px; text-align: left; }
        .menu-icon { font-size: 22px; margin-bottom: 10px; }
        .menu-title { font-weight: 800; font-size: 14px; }
        .menu-desc { color: #8d929d; font-size: 11px; margin-top: 5px; }
        .back-btn {
            margin: 18px 20px 5px; border: none; background: transparent;
            padding: 0; font-size: 14px; font-weight: 700; color: #666;
        }
        .mode-title { padding: 0 20px; margin-top: 22px; }
        .mode-title h1 { margin: 0; font-size: 25px; }
        .mode-title p { color: #9095a0; font-size: 13px; margin-top: 8px; }
        .mode-list { padding: 15px 20px; }
        .mode-card {
            width: 100%; border: 1px solid #e8eaf0; background: white;
            border-radius: 20px; padding: 20px; margin-bottom: 12px;
            text-align: left; display: flex; align-items: center; gap: 15px;
        }
        .mode-icon {
            width: 48px; height: 48px; border-radius: 15px; background: #f1f3ff;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .mode-name { font-weight: 800; font-size: 15px; }
        .mode-desc { margin-top: 5px; color: #9196a2; font-size: 12px; }
        .quiz-screen { min-height: 100vh; }
        .quiz-top { padding: 18px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
        .quiz-left { display: flex; align-items: center; gap: 10px; }
        .quiz-exit {
            border: none; background: #f2f3f7; padding: 9px 12px;
            border-radius: 11px; font-size: 12px; font-weight: 700;
        }
        .quiz-subject { font-size: 13px; font-weight: 800; color: #667eea; }
        .question-number { font-size: 13px; color: #858b97; font-weight: 700; }
        .quiz-progress { height: 6px; background: #eceef4; margin: 0 20px; border-radius: 20px; overflow: hidden; }
        .quiz-progress-fill { height: 100%; width: 0%; background: #667eea; border-radius: 20px; transition: 0.2s; }
        .question-area { padding: 28px 20px 10px; }
        .question-area h2 { font-size: 19px; line-height: 1.5; margin: 0; word-break: keep-all; white-space: pre-line; }
        .options { padding: 18px 20px; }
        .option {
            width: 100%; padding: 15px; margin-bottom: 10px; background: white;
            border: 1px solid #e3e6ed; border-radius: 15px; text-align: left;
            font-size: 14px; line-height: 1.4;
        }
        .option:hover { border-color: #667eea; }
        .option.correct { border-color: #4caf50; background: #effaf1; }
        .option.wrong { border-color: #f44336; background: #fff2f2; }
        .option.disabled { cursor: default; }
        .explanation {
            display: none; margin: 5px 20px 20px; padding: 18px;
            border-radius: 16px; background: #f6f7fb;
        }
        .explanation.show { display: block; }
        .answer-status { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
        .answer-status.correct-text { color: #2e8b3c; }
        .answer-status.wrong-text { color: #d93636; }
        .explanation-text { font-size: 13px; line-height: 1.6; color: #555b67; }
        .next-btn {
            width: calc(100% - 40px); margin: 0 20px; padding: 15px; border: none;
            border-radius: 14px; background: #667eea; color: white;
            font-weight: 800; font-size: 14px;
        }
        .next-btn:disabled { background: #d8dbe4; cursor: default; }
        .result { text-align: center; padding: 70px 25px 30px; }
        .result-icon { font-size: 55px; }
        .result h1 { font-size: 28px; margin: 15px 0 8px; }
        .result-score { font-size: 48px; font-weight: 900; color: #667eea; margin: 25px 0; }
        .result p { color: #858b96; font-size: 14px; }
        .result-buttons { margin-top: 35px; }
        .result-buttons button {
            width: 100%; padding: 15px; border-radius: 14px;
            border: none; margin-bottom: 10px; font-weight: 800;
        }
        .primary-btn { background: #667eea; color: white; }
        .secondary-btn { background: #f0f2f7; color: #333; }
        .page-title { padding: 25px 20px 5px; }
        .page-title h1 { margin: 0; font-size: 25px; }
        .page-title p { margin-top: 8px; color: #9297a2; font-size: 13px; }
        .wrong-tabs { display: flex; gap: 8px; padding: 18px 20px 10px; overflow-x: auto; }
        .wrong-tab {
            border: none; background: #f0f2f7; color: #737985;
            padding: 10px 15px; border-radius: 20px; font-size: 12px;
            font-weight: 800; white-space: nowrap;
        }
        .wrong-tab.active { background: #667eea; color: white; }
        .wrong-list { padding: 10px 20px; }
        .wrong-card { border: 1px solid #e8eaf0; border-radius: 18px; padding: 17px; margin-bottom: 12px; }
        .wrong-subject {
            display: inline-block; font-size: 11px; font-weight: 800;
            color: #667eea; background: #f0f2ff; padding: 5px 8px;
            border-radius: 8px; margin-bottom: 10px;
        }
        .wrong-question { font-size: 14px; font-weight: 700; line-height: 1.5; white-space: pre-line; }
        .wrong-answer { margin-top: 10px; font-size: 12px; color: #666c78; line-height: 1.5; }
        .remove-wrong {
            margin-top: 12px; border: none; background: #f3f4f7;
            border-radius: 9px; padding: 7px 10px; font-size: 11px;
        }
        .empty { text-align: center; padding: 70px 20px; color: #9ba0aa; }
        .empty-icon { font-size: 40px; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
        .stat-card { background: #f7f8fc; border-radius: 17px; padding: 18px 10px; text-align: center; }
        .stat-number { font-size: 21px; font-weight: 900; }
        .stat-label { margin-top: 6px; color: #9297a2; font-size: 11px; }
        .my-section { padding: 0 20px; }
        .my-subject { padding: 18px; border: 1px solid #e9ebf0; border-radius: 18px; margin-bottom: 12px; }
        .my-subject-top { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
        .reset-btn {
            width: calc(100% - 40px); margin: 20px; padding: 14px;
            border: none; background: #f1f2f5; border-radius: 14px;
            color: #777c86; font-weight: 700;
        }
        .toast {
            position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%);
            background: #252830; color: white; padding: 12px 17px;
            border-radius: 12px; font-size: 12px; opacity: 0;
            pointer-events: none; transition: 0.25s; z-index: 100;
        }
        .toast.show { opacity: 1; }
        @media (min-width: 481px) {
            body { padding: 20px 0; }
            .app { min-height: calc(100vh - 40px); border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen active">
        <header>
            <div class="logo">하지<span>  </span></div>
            <div class="header-right">
                <button class="header-btn" onclick="showWrongNotebook()">오답</button>
                <button class="header-btn" onclick="showMyPage()">MY</button>
            </div>
        </header>

        <div class="hero">
            <div class="hero-small">TODAY'S STUDY</div>
            <h1>오늘도 전공 공부<br>해볼까요?</h1>
            <p>전 과목 기출에서 랜덤으로 5문제를 풀어보세요.</p>
            <div class="daily-info">
                <div class="daily-top">
                    <span>오늘의 목표</span>
                    <span id="dailyCount">0 / 5</span>
                </div>
                <div class="daily-bar">
                    <div id="dailyBarFill" class="daily-bar-fill"></div>
                </div>
                <button class="quick-start" onclick="startDailyQuiz()">오늘의 5문제 시작 →</button>
            </div>
        </div>

        <div class="section-title" style="padding:0 20px;">과목 선택</div>
        <div class="search-box">
            <input id="searchInput" type="text" placeholder="과목 검색 (예: 혈액학, 법규, 화학, 미생물...)" oninput="searchSubjects()">
        </div>
        <div class="section-subtitle" style="padding:0 20px; margin-top:14px;">
            단일 과목별로 기출문제를 선택해서 공부해보세요.
        </div>

        <!-- JS에서 자동 생성 -->
        <div id="subjectList" class="subjects"></div>

        <div class="section-title" style="padding:0 20px;">바로가기</div>
        <div class="menu-grid">
            <button class="menu-card" onclick="showWrongNotebook()">
                <div class="menu-icon">📕</div>
                <div class="menu-title">오답노트</div>
                <div class="menu-desc">틀린 문제 다시 보기</div>
            </button>
            <button class="menu-card" onclick="showMyPage()">
                <div class="menu-icon">📊</div>
                <div class="menu-title">학습 기록</div>
                <div class="menu-desc">나의 공부 기록 확인</div>
            </button>
        </div>
    </div>

    <!-- MODE SCREEN -->
    <div id="modeScreen" class="screen">
        <button class="back-btn" onclick="goHome()">← 홈으로</button>
        <div class="mode-title">
            <h1 id="modeSubjectTitle">과목명</h1>
            <p>원하는 학습 방법을 선택하세요.</p>
        </div>
        <div class="mode-list">
            <button class="mode-card" onclick="startQuiz('basic')">
                <div class="mode-icon">📖</div>
                <div>
                    <div class="mode-name">기본 학습</div>
                    <div class="mode-desc">문제를 순서대로 풀면서 해설을 확인해요.</div>
                </div>
            </button>
            <button class="mode-card" onclick="startQuiz('random')">
                <div class="mode-icon">🎲</div>
                <div>
                    <div class="mode-name">랜덤 퀴즈</div>
                    <div class="mode-desc">문제 순서를 랜덤으로 섞어서 풀어요.</div>
                </div>
            </button>
            <button class="mode-card" onclick="startQuiz('wrong')">
                <div class="mode-icon">📕</div>
                <div>
                    <div class="mode-name">오답 복습</div>
                    <div class="mode-desc">틀렸던 문제만 다시 풀어봐요.</div>
                </div>
            </button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="screen quiz-screen">
        <div class="quiz-top">
            <div class="quiz-left">
                <button class="quiz-exit" onclick="exitQuiz()">← 나가기</button>
                <div id="quizSubject" class="quiz-subject">과목</div>
            </div>
            <div id="questionNumber" class="question-number">1 / 20</div>
        </div>
        <div class="quiz-progress">
            <div id="quizProgressFill" class="quiz-progress-fill"></div>
        </div>
        <div class="question-area">
            <h2 id="questionText">문제가 들어갑니다.</h2>
        </div>
        <div id="options" class="options"></div>
        <div id="explanation" class="explanation">
            <div id="answerStatus" class="answer-status"></div>
            <div id="explanationText" class="explanation-text"></div>
        </div>
        <button id="nextButton" class="next-btn" onclick="nextQuestion()" disabled>정답을 선택해주세요</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="screen">
        <div class="result">
            <div class="result-icon">🎉</div>
            <h1>학습 완료!</h1>
            <div id="resultScore" class="result-score">0 / 20</div>
            <p id="resultMessage">잘했어요!</p>
            <div class="result-buttons">
                <button class="primary-btn" onclick="retryQuiz()">다시 풀기</button>
                <button class="secondary-btn" onclick="goHome()">홈으로 돌아가기</button>
            </div>
        </div>
    </div>

    <!-- WRONG NOTEBOOK -->
    <div id="wrongScreen" class="screen">
        <button class="back-btn" onclick="goHome()">← 홈으로</button>
        <div class="page-title">
            <h1>오답노트</h1>
            <p>틀린 문제를 과목별로 다시 확인해보세요.</p>
        </div>
        <div id="wrongTabs" class="wrong-tabs"></div>
        <div id="wrongList" class="wrong-list"></div>
    </div>

    <!-- MY PAGE -->
    <div id="myScreen" class="screen">
        <button class="back-btn" onclick="goHome()">← 홈으로</button>
        <div class="page-title">
            <h1>MY</h1>
            <p>나의 학습 기록을 확인해보세요.</p>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div id="totalSolved" class="stat-number">0</div>
                <div class="stat-label">푼 문제</div>
            </div>
            <div class="stat-card">
                <div id="totalCorrect" class="stat-number">0</div>
                <div class="stat-label">정답</div>
            </div>
            <div class="stat-card">
                <div id="accuracy" class="stat-number">0%</div>
                <div class="stat-label">정답률</div>
            </div>
        </div>
        <div class="section-title" style="padding:0 20px;">과목별 기록</div>
        <div id="mySubjectSection" class="my-section"></div>
        <button class="reset-btn" onclick="resetAllData()">학습 기록 초기화</button>
    </div>

</div>

<div id="toast" class="toast">저장되었습니다.</div>

<script>
/* =========================================================================
   과목 설정 (단일 과목 1개씩 총 11개 카테고리)
========================================================================= */
const SUBJECTS = [
    { key: "hematology", name: "혈액학", icon: "🩸", desc: "기본 + 국시 기출" },
    { key: "physiology", name: "생리학", icon: "🫀", desc: "Physiology 기초" },
    { key: "medicalLaw", name: "의료관계법규", icon: "⚖️", desc: "제50·51·53회 국시 1교시" },
    { key: "publicHealth", name: "공중보건학", icon: "🏥", desc: "제50·51·53회 국시 1교시" },
    { key: "anatomy", name: "해부생리학", icon: "🦴", desc: "제50·51·53회 국시 1교시" },
    { key: "histopathology", name: "조직병리학", icon: "🔬", desc: "제50·51·53회 국시 1·3교시" },
    { key: "cytopathology", name: "세포병리학", icon: "🧪", desc: "제50·51·53회 국시 1·3교시" },
    { key: "physiologicalTest", name: "생리기능학", icon: "📈", desc: "제50·51·53회 국시 1교시" },
    { key: "clinicalChem", name: "임상화학", icon: "⚗️", desc: "제50·51·53회 요화학·임상화학·핵의학" },
    { key: "transfusion", name: "수혈의학", icon: "💉", desc: "제50·51·53회 혈액은행 기출" },
    { key: "microbiology", name: "임상미생물학", icon: "🦠", desc: "제50·51·53회 세균·진균·바이러스·면역" }
];

// 단축키 포맷 [질문, [보기들], 정답인덱스(0~4), 해설]을 객체로 변환하는 헬퍼
function buildQuestions(rawList) {
    return rawList.map(item => ({
        question: item[0],
        options: item[1],
        answer: item[2],
        explanation: item[3]
    }));
}

/* =========================================================================
   전체 과목별 기출문제 데이터베이스
========================================================================= */
const QUESTION_BANK = {

    // 1. 혈액학 (기존 20문항 + 53회 2교시 및 실기 기출)
    hematology: buildQuestions([
        ["혈액의 액체 성분으로 혈액세포가 떠 있는 것은?", ["혈장","혈소판","적혈구","백혈구"], 0, "혈장은 혈액의 액체 성분으로 혈액세포와 물질을 운반합니다."],
        ["적혈구의 가장 중요한 기능은?", ["혈액 응고","산소 운반","항체 생성","식균 작용"], 1, "적혈구는 헤모글로빈을 이용해 산소를 운반합니다."],
        ["헤모글로빈의 주요 기능은?", ["혈액 응고","산소 운반","항체 생성","호르몬 생성"], 1, "헤모글로빈은 적혈구 내에서 산소를 운반합니다."],
        ["정상적인 적혈구의 형태는?", ["구형","양면오목 원반형","방추형","입방형"], 1, "정상 적혈구는 중앙이 오목한 양면오목 원반형입니다."],
        ["성숙한 정상 적혈구의 특징으로 옳은 것은?", ["핵이 있다","핵과 대부분의 세포소기관이 없다","미토콘드리아가 많다","DNA 합성을 활발히 한다"], 1, "성숙 적혈구는 핵과 세포소기관이 없어 산소 운반에 특화되어 있습니다."],
        ["골수에서 적혈구 생성 상태를 평가할 때 이용되는 세포는?", ["호중구","망상적혈구","단핵구","혈소판"], 1, "망상적혈구(그물적혈구)는 골수의 적혈구 조혈능을 반영합니다."],
        ["다음 중 백혈구가 아닌 것은?", ["호중구","림프구","단핵구","혈소판"], 3, "혈소판은 거핵구 세포질 조각으로 지혈에 관여합니다."],
        ["정상 말초혈액에서 가장 많은 백혈구는?", ["호산구","호염기구","호중구","단핵구"], 2, "말초혈액 백혈구 중 호중구가 50~70%로 가장 많습니다."],
        ["호산구와 관련이 가장 큰 것은?", ["기생충 감염과 알레르기 반응","혈액 응고","산소 운반","적혈구 생성"], 0, "호산구는 기생충 감염 및 알레르기 질환에서 증가합니다."],
        ["림프구의 주요 기능과 가장 관련 있는 것은?", ["적혈구 생성","적응면역","혈액 응고","산소 운반"], 1, "림프구(T, B세포)는 특이적 적응면역을 담당합니다."],
        ["단핵구가 조직으로 이동한 후 분화할 수 있는 세포는?", ["대식세포","적혈구","혈소판","호산구"], 0, "단핵구는 혈중을 순환하다 조직으로 이동해 대식세포(큰포식세포)로 분화합니다."],
        ["혈소판의 주요 기능은?", ["산소 운반","혈액 응고와 지혈","항체 생성","이산화탄소 생성"], 1, "혈소판은 1차 지혈전 형성 및 혈액 응고에 핵심적입니다."],
        ["지혈 과정에서 혈관 손상 직후 나타나는 반응은?", ["혈관 수축","적혈구 생성","항체 생성","용혈"], 0, "혈관 손상 직후 신경성·체액성 반사로 혈관 수축이 일어납니다."],
        ["일반적인 혈액학 검사(CBC)에서 항응고제로 가장 많이 사용되는 것은?", ["EDTA","헤파린","구연산나트륨","불화나트륨"], 0, "CBC 검사에는 혈구 형태 보존이 우수한 EDTA를 사용합니다."],
        ["EDTA가 들어 있는 채혈관의 일반적인 마개 색은?", ["빨간색","보라색","파란색","회색"], 1, "EDTA 채혈관은 보라색(lavender) 마개를 사용합니다."],
        ["CBC(일반혈액검사)에 포함되는 항목으로 가장 적절한 것은?", ["적혈구, 백혈구, 혈소판","혈당, 콜레스테롤, 중성지방","AST, ALT, ALP","요소, 크레아티닌, 요산"], 0, "CBC는 적혈구, 백혈구, 혈소판 수 및 적혈구 항수를 측정합니다."],
        ["헤마토크릿(Hct)은 무엇을 의미하는가?", ["혈액 내 백혈구의 수","혈액 내 혈소판의 수","혈액에서 적혈구가 차지하는 용적 비율","혈장 단백질 농도"], 2, "전혈 중 적혈구 용적이 차지하는 백분율(%)입니다."],
        ["MCV가 의미하는 것은?", ["평균 적혈구 용적","평균 혈소판 수","백혈구 수","헤모글로빈 농도"], 0, "MCV(Mean Corpuscular Volume)는 평균 적혈구 용적입니다."],
        ["MCV가 감소한 빈혈은 일반적으로 어떤 형태인가?", ["대구성 빈혈","정구성 빈혈","소구성 빈혈","거대적혈구증"], 2, "MCV가 80fL 미만으로 감소하면 소구성 빈혈로 분류합니다."],
        ["말초혈액도말검사의 주요 목적은?", ["혈액세포의 형태와 분포 관찰","혈당 측정","혈액의 pH 측정","혈압 측정"], 0, "혈구 세포의 형태학적 이상과 분포를 관찰합니다."],
        ["G-6-PD 결핍으로 인한 혈색소의 산화적 변성물로, 초생체 염색으로 관찰 가능한 봉입체는?", ["Auer body","Döhle body","Heinz body","Russell's bodies","Pappenheimer body"], 2, "산화적 손상으로 변성된 불용성 혈색소 침전물은 하인츠 소체(Heinz body)이며 크리스탈 바이올렛 등 초생체염색으로 관찰합니다."],
        ["저산소증에 대한 반응으로, 신장에서 합성되는 적혈구 조혈 자극인자는?", ["ferritin","fibrinogen","leukopoietin","erythropoietin","thrombopoietin"], 3, "신장의 세뇨관주위 간질세포에서 저산소 자극에 의해 에리스로포이에틴(EPO)이 분비됩니다."],
        ["다음의 특성을 보이는 혈색소는?\n• α2γ2로 구성 • 지중해빈혈에서 증가\n• 산과 알칼리에 높은 저항성 • 정상 성인 혈액 중 1~2% 존재", ["Hb A1","Hb A2","Hb D","Hb F","Hb S"], 3, "태아혈색소(Hb F)는 α2γ2로 구성되며 알칼리 변성 저항성을 가집니다."],
        ["파펜하이머 소체(Pappenheimer body)의 성분은?", ["리보솜","철과립","핵 잔유물","방추사 잔유물","혈색소 변성물질"], 1, "파펜하이머 소체는 적혈구 내 비헴성 철과립(무기철) 침착물입니다."],
        ["적혈구막의 단백질 결함으로 표면적이 감소하여 저장액에서 강한 삼투압 취약성을 보이는 세포는?", ["낫적혈구","구형적혈구","분열적혈구","표적적혈구","입모양적혈구"], 1, "유전성 구형적혈구증에서는 스펙트린 등 세포막 골격단백 결함으로 구형적혈구가 나타나며 삼투압 취약성이 증가합니다."],
        ["백혈구 성숙단계 중에서 이차 과립(특이적 과립)이 형성되며, 세포분열을 할 수 있는 마지막 단계는?", ["골수모구","전골수구","골수구","후골수구","중성구"], 2, "골수구(Myelocyte)는 2차(특이) 과립이 출현하고 세포분열이 가능한 마지막 단계입니다."],
        ["아우어 소체(Auer body)의 설명으로 옳은 것은?", ["철과립이다.","RNA 침전물이다.","변성된 혈색소이다.","peroxidase 염색 시 양성이다.","급성림프세포백혈병(ALL)에서 발견된다."], 3, "아우어 소체는 아주르 과립이 융합된 막대 모양 구조물로 골수계(AML)에 특이적이며 MPO 및 SBB 염색에 강양성입니다."],
        ["혈소판 고밀도과립(dense granule)에 존재하며 혈소판 응집을 촉진하는 물질은?", ["PF4","ADP","PDGF","albumin","heparin"], 1, "혈소판 고밀도과립(δ-granule)에는 ADP, ATP, 칼슘(Ca2+), 세로토닌이 들어있어 혈소판 응집을 유도합니다."],
        ["간에서 합성되는 비타민 K 의존성 응고인자는?", ["factor I","factor II","factor III","factor V","factor VIII"], 1, "비타민 K 의존성 응고인자는 제II(프로트롬빈), VII, IX, X 인자입니다."],
        ["혈액응고인자 중 혈장 내 농도가 가장 높으며, thrombin에 의하여 활성화되는 인자는?", ["섬유소원","프로트롬빈","이온화 칼슘","항혈우병인자 B","조직트롬보플라스틴"], 0, "제I인자인 섬유소원(Fibrinogen)은 혈장 농도가 약 200~400 mg/dL로 가장 높으며 트롬빈에 의해 섬유소(fibrin)로 전환됩니다."],
        ["비타민B12나 엽산 결핍으로 인한 DNA합성 장애로 발생하며, 과다분엽핵중성구(hypersegmented neutrophil)가 관찰되는 질환은?", ["용혈빈혈","악성빈혈","지중해빈혈","철결핍빈혈","재생불량빈혈"], 1, "비타민 B12(내인자 결핍 시 악성빈혈)나 엽산 결핍은 거대적혈모구빈혈을 일으키며 말초혈액에 과분엽 호중구가 관찰됩니다."],
        ["다음의 특징이 관찰되는 질환은?\n• 소구성 저색소성 적혈구 • 혈청철 감소\n• 저장철 감소 • TIBC 증가", ["악성빈혈","철결핍빈혈","엽산결핍빈혈","재생불량빈혈","거대적혈모구빈혈"], 1, "철결핍빈혈(IDA)은 소구성 저색소성 빈혈이며 혈청철과 페리틴은 감소하고 총철결합능(TIBC)은 증가합니다."],
        ["다음 검사 결과로 예상되는 질환은?\n• 말초혈액에서 모든 성숙단계의 골수계 세포 관찰 • 호산구, 호염기구 증가\n• LAP score 감소 • 필라델피아 염색체 t(9;22), BCR/ABL1 양성", ["급성림프세포백혈병(ALL)","급성전골수세포백혈병(APL)","만성골수세포백혈병(CML)","만성림프세포백혈병(CLL)","털세포백혈병(hairy cell leukemia)"], 2, "t(9;22) 필라델피아 염색체와 LAP 점수 감소는 만성골수세포백혈병(CML)의 특징입니다."],
        ["말초혈액도말에서 반응림프구(reactive lymphocyte)가 10% 이상 관찰되고, 혈청검사에서 엡스타인-바 바이러스(EBV)가 확인되었다. 예상되는 질환은?", ["다발골수종","감염단핵구증","재생불량빈혈","급성골수세포백혈병","만성골수세포백혈병"], 1, "EBV 감염에 의해 비정형(반응성) 림프구가 증가하는 질환은 감염단핵구증(전염성 단핵구증)입니다."],
        ["심한 출혈을 동반한 환자의 검사 결과가 [PT-정상, aPTT-연장, 혼합 aPTT-교정]이다. 결핍이 예상되는 응고인자는?", ["factor I","factor II","factor VII","factor VIII","factor X"], 3, "내인계 경로(XII, XI, IX, VIII) 인자 결핍 시 PT는 정상이고 aPTT만 연장되며 혼합검사에서 교정됩니다."],
        ["자동혈액분석기를 이용하여 평균적혈구용적(MCV) 측정 결과가 120 fL일 때 해석은?", ["대적혈구 증가","소적혈구 증가","변형적혈구 증가","정상적혈구 증가","거대혈소판 증가"], 0, "정상 MCV는 80~100 fL이므로 120 fL은 대적혈구(macrocyte) 증가를 의미합니다."],
        ["한랭자가응집(cold autoagglutination)이 있는 혈액검체를 자동혈액분석기로 측정했을 때 나타날 수 있는 현상은?", ["적혈구 수 감소","중성구 수 감소","호산구 수 감소","혈소판 수 증가","호염기구 수 증가"], 0, "적혈구끼리 응집덩어리를 형성하여 큰 1개의 세포로 인식되므로 적혈구 수(RBC)와 Hct는 거짓 감소하고 MCV, MCHC는 거짓 상승합니다."],
        ["혈색소의 글로빈사슬 중 β-사슬의 6번째 아미노산인 글루탐산이 발린으로 치환되어 낫적혈구빈혈을 일으키는 이상혈색소는?", ["Hb C","Hb D","Hb E","Hb H","Hb S"], 4, "낫적혈구빈혈(겸상적혈구빈혈)의 원인 혈색소는 Hb S입니다."],
        ["혈액질환을 진단하기 위해 글리코겐을 포함한 다당류를 염색하는 세포화학염색법은?", ["iron 염색","Sudan black B(SBB) 염색","myeloperoxidase(MPO) 염색","periodic acid Schiff(PAS) 염색","non-specific esterase(NSE) 염색"], 3, "PAS 염색은 세포질 내 글리코겐 등 다당류를 적자색으로 염색하며 급성림프모구백혈병(ALL)과 적백혈병(M6) 진단에 유용합니다."],
        ["말초혈액 도말표본 현미경 관찰에서 모세포(blast)가 다수 관찰되어 급성백혈병이 의심된다면 추가로 시행할 검사는?", ["햄 검사(Ham test)","실링 검사(Schilling test)","혈색소 전기영동","골수 검사(bone marrow examination)","삼투압 취약성 검사"], 3, "급성백혈병의 확진을 위해서는 골수 천자 및 생검(골수 검사)을 시행해야 합니다."],
        ["섬유소원에서 섬유소로 전환되는 시간을 측정하는 검사는?", ["Bleeding time(BT)","Thrombin time(TT)","Stypven time(DRVVT)","Prothrombin time(PT)","aPTT"], 1, "트롬빈 시간(TT)은 혈장에 트롬빈을 첨가하여 섬유소원이 섬유소로 전환되는 시간을 측정합니다."],
        ["PT 검사는 정상, aPTT 검사는 연장되어 혼합검사(mixing test)를 시행하였다. aPTT 결과가 교정되지 않았을 경우 적절한 해석은?", ["V 인자 결핍","VII 인자 결핍","X 인자 결핍","루푸스항응고 인자 존재","본빌레브란드 인자 결핍"], 3, "혼합검사 후에도 교정되지 않으면 순환성 항응고물질(억제인자, 예: 루푸스항응고인자)이 존재하는 것입니다."],
        ["흐름세포분석기(flow cytometry)를 사용한 면역표현형검사에서 CD34 양성 결과를 확인하였다면 추측할 수 있는 세포는?", ["B 림프구","T 림프구","대식세포","형질세포","조혈줄기세포"], 4, "CD34는 조혈모세포(조혈줄기세포, HSC) 및 미성숙 전구세포의 대표적 표지자입니다."],

        ["「감염병의 예방 및 관리에 관한 법률」상 보건소를 이용하기 불편한 주민 등에 대한 예방접종업무를 의료기관에 위탁할 수 있는 자는?", ["보건소장","시·도지사","질병관리청장","보건복지부장관","특별자치도지사 또는 시장·군수·구청장"], 4, "특별자치도지사 또는 시장·군수·구청장이 관할 의료기관에 위탁할 수 있습니다."],
        ["「감염병의 예방 및 관리에 관한 법률」상 고위험병원체를 보유·관리하는 자는 매년 보유현황 기록을 작성하여 누구에게 제출하여야 하는가?", ["보건소장","시·도지사","질병관리청장","보건복지부장관","시장·군수·구청장"], 2, "고위험병원체 보유현황은 매년 질병관리청장에게 제출합니다."],
        ["「지역보건법」상 보건소의 업무범위 중 지역주민의 건강증진 및 질병예방·관리를 위한 지역보건의료 서비스로 옳지 않은 것은?", ["감염병의 예방 및 관리","모성과 영유아의 건강유지·증진","청소년 선도 및 학교보건에 관한 사항","정신건강증진 및 생명존중에 관한 사항","여성·노인·장애인 등 보건의료 취약계층의 건강유지·증진"], 2, "청소년 선도 및 학교보건에 관한 사항은 보건소의 업무가 아닙니다."],
        ["「지역보건법」상 보건등 직렬의 공무원을 보건소장으로 임용하는 경우 최근 최소 몇 년 이상 보건등의 업무와 관련된 근무경험이 있는 자로 하여야 하는가?", ["1년 이상","3년 이상","5년 이상","7년 이상","9년 이상"], 2, "임용 전 최근 5년 이상 보건 등의 업무와 관련하여 근무한 경험이 있는 사람으로 임용하여야 합니다(제50회 국시원 최종답안 3번: 5년 이상)."],
        ["「지역보건법」상 건강검진 등 신고서를 제출받은 보건소장은 신고인에게 신고의 수리 여부를 언제까지 통지하여야 하는가?", ["지체없이","3일 이내","5일 이내","7일 이내","9일 이내"], 3, "신고를 받은 날부터 7일 이내에 통지하여야 합니다."],
        ["「혈액관리법」상 혈액원에서 수행하는 혈액관리업무로 옳지 않은 것은?", ["채혈 업무","혈액제제의 공급 업무","혈액제제의 판매 업무","혈액제제의 보존 업무","혈액제제의 품질관리 업무"], 2, "혈액제제의 판매 업무는 혈액관리업무에 해당하지 않습니다."],
        ["「혈액관리법」상 혈액관리업무를 할 수 있는 자 중 채혈업무를 할 수 없는 자는?", ["의원","병원","종합병원","대한적십자사","혈액제제 제조업자"], 4, "혈액제제 제조업자는 채혈업무를 제외한 혈액관리업무만 가능합니다."],
        ["「혈액관리법」상 부적격 혈액·혈액제제에 해당하는 것은?", ["매독검사 결과 음성인 혈액","C형 간염검사결과 음성인 혈액","후천성면역결핍증 검사결과 음성인 혈액","사람T세포림프친화바이러스(HTLV) 검사결과 음성인 혈액","간기능검사(ALT검사, 수혈용 혈액) 결과 101 IU/L 이상인 혈액"], 4, "ALT 101 IU/L 이상인 수혈용 혈액은 부적격 혈액입니다."],
        ["「혈액관리법」상 특정수혈부작용이 발생한 경우 그 발생 원인의 파악 등을 위한 실태조사를 하여야 하는 자는?", ["혈액원장","시·도지사","질병관리청장","보건복지부장관","대한적십자사회장"], 3, "특정수혈부작용 발생 원인 실태조사는 보건복지부장관이 실시합니다."],
        ["「의료법」상 의료인이나 의료기관 개설자가 보존하여야 할 진료기록부등의 보존 기간이 5년이 아닌 것은?", ["처방전","간호기록부","방사선 사진","조산기록부","검사 소견 기록"], 0, "처방전의 보존 기간은 2년입니다. (진료기록부·수술기록은 10년, 간호기록부·조산기록부·검사소견기록·방사선사진은 5년)"],
        ["「의료법」상 직접 진찰을 받은 환자가 의식이 없는 경우에 환자를 대리하여 처방전을 수령할 수 없는 자는?", ["배우자","직계비속","직계존속","형제자매","배우자의 형제자매"], 4, "대리수령 가능자는 배우자, 직계존속·비속, 배우자의 직계존속, 형제자매 등이며 '배우자의 형제자매'는 포함되지 않습니다."],
        ["「의료법」상 100병상 이상 300병상 이하의 종합병원이 반드시 갖추어야 하는 진료과목은?", ["치과","정형외과","가정의학과","영상의학과","이비인후과"], 3, "100~300병상 종합병원은 내과·외과·소아청소년과·산부인과 중 3개 진료과목, 영상의학과, 마취통증의학과와 진단검사의학과 또는 병리과를 포함한 7개 이상의 진료과목을 갖추어야 합니다."],
        ["「의료법」상 의료인의 품위를 심하게 손상시키는 행위를 한 경우 행정처분은?", ["경고 처분","면허 취소","시정명령","면허자격정지","과태료 부과"], 3, "품위손상행위는 1년 이내의 면허자격정지 사유입니다."],
        ["「의료기사 등에 관한 법률」상 임상병리사의 구체적인 업무 범위가 아닌 것은?", ["검사용 시약의 조제","검사물 등의 채취·검사","혈액의 채혈·제제·보존","방사선 등 관련 기기의 취급","기계·기구·시약 등의 보관·관리"], 3, "방사선 등 관련 기기의 취급은 방사선사의 업무입니다."],
        ["「의료기사 등에 관한 법률」상 국가시험 응시자격에 제한을 받지 않는 자는?", ["피성년후견인","마약류 중독자","파산선고를 받은 자","국가시험에 관하여 부정행위를 한 자","부정한 방법으로 국가시험에 응시한 자"], 2, "파산선고를 받은 자는 의료기사 결격사유나 국시 응시제한 대상이 아닙니다."],
        ["「의료기사 등에 관한 법률」상 의료기사등의 면허 취소 사유에 해당되지 않는 것은?", ["결격사유에 해당할 때","타인에게 면허증을 대여한 때","면허자격정지 기간 중에 업무를 행한 때","3회 이상 면허자격정지 처분을 받은 때","의료기사등의 업무범위에서 벗어나는 행위를 한 때"], 4, "업무범위를 벗어난 행위는 면허자격정지(6개월 이내) 사유입니다."],
        ["「의료기사 등에 관한 법률」상 업무에 종사하지 않다가 다시 종사하려는 임상병리사 중 보수교육이 3년 이상 유예된 경우 받아야 하는 최소 보수교육 시간은?", ["8시간 이상","12시간 이상","16시간 이상","20시간 이상","24시간 이상"], 3, "1년 유예 시 12시간, 2년 유예 시 16시간, 3년 이상 유예 시 20시간 이상을 이수해야 합니다."],
        ["「의료기사 등에 관한 법률」상 의료기사등이 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해지는 경우가 아닌 것은?", ["면허 대여를 알선한 경우","업무상 알게 된 비밀을 누설한 경우","면허 없이 의료기사등의 업무를 행한 경우","타인에게 의료기사등의 면허증을 대여한 경우","면허 없이 의료기사등과 유사한 명칭을 사용한 경우"], 4, "유사 명칭 사용은 과태료(300만원 이하) 처분 대상입니다."],
        ["「감염병의 예방 및 관리에 관한 법률」상 '감염병의사환자'에 해당하는 사람은?", ["감염병환자등과 접촉하거나 접촉이 의심되는 사람","검역관리지역에 체류하거나 그 지역을 경유한 사람","감염병병원체 등 위험요인에 노출되어 감염이 우려되는 사람","임상적인 증상은 없으나 감염병병원체를 보유하고 있는 사람","감염병병원체가 인체에 침입한 것으로 의심되나 감염병환자로 확인되기 전 단계에 있는 사람"], 4, "병원체가 침입한 것으로 의심되나 감염병환자로 확인되기 전 단계에 있는 사람이 '감염병의사환자'입니다."],
        ["「감염병의 예방 및 관리에 관한 법률」상 보건소장이 특별자치도지사 또는 시장·군수·구청장에게 보고할 때 감염병 구분에 따른 보고 시기로 옳지 않은 것은?", ["제1급감염병의 발생, 사망, 병원체 검사 결과의 보고: 즉시","제2급감염병의 발생, 사망, 병원체 검사 결과의 보고: 24시간 이내","제3급감염병의 발생, 사망, 병원체 검사 결과의 보고: 3일 이내","제4급감염병의 발생, 사망의 보고: 7일 이내","예방접종 후 이상반응의 보고: 즉시"], 2, "제3급감염병의 보고 시기도 제2급과 동일하게 24시간 이내입니다."],
        ["「감염병의 예방 및 관리에 관한 법률」상 예방접종업무를 위탁하였을 때 예방접종 비용 산정 및 비용 상환 절차 등에 관해 필요한 사항을 정하여 고시하는 자는?", ["보건소장","시·도지사","질병관리청장","시장·군수·구청장","식품의약품안전처장"], 2, "질병관리청장이 정하여 고시합니다."],
        ["「감염병의 예방 및 관리에 관한 법률」상 질병관리청장의 보유허가를 받지 아니하고 생물테러감염병병원체를 보유한 자에게 처하는 벌칙으로 옳은 것은?", ["5년 이하의 징역 또는 5천만원 이하의 벌금","3년 이하의 징역 또는 3천만원 이하의 벌금","2년 이하의 징역 또는 2천만원 이하의 벌금","1년 이하의 징역 또는 2천만원 이하의 벌금","1년 이하의 징역 또는 1천만원 이하의 벌금"], 0, "무허가 생물테러감염병병원체 보유 시 5년 이하의 징역 또는 5천만원 이하의 벌금에 처합니다."],
        ["「지역보건법」상 해당 시·군·구의 인구가 몇 명을 초과할 때 보건소를 추가로 설치할 수 있는가?", ["10만 명","15만 명","20만 명","25만 명","30만 명"], 4, "시·군·구의 인구가 30만 명을 초과하는 경우 보건소를 추가 설치할 수 있습니다."],
        ["「지역보건법」상 보건소의 업무 중 지역주민의 건강증진 및 질병예방·관리를 위하여 제공하는 지역보건의료서비스가 아닌 것은?", ["학교보건사업","감염병의 예방 및 관리","모성과 영유아의 건강유지·증진","여성·노인·장애인의 건강유지·증진","국민건강증진·구강건강·영양관리사업"], 0, "학교보건사업은 보건소 고유 업무가 아닙니다."],
        ["「지역보건법」상 의료기관이 의료기관 외의 장소에서 지역주민 다수를 대상으로 건강검진 등 행위를 하려는 경우에는 누구에게 신고하여야 하는가?", ["시·도지사","관할 경찰서장","관할 보건소장","보건복지부장관","시장·군수·구청장"], 2, "관할 보건소장에게 신고하여야 합니다."],
        ["「혈액관리법」상 사용하는 용어의 정의로 옳지 않은 것은?", ["혈액: 인체에서 채혈한 혈구 및 혈장","헌혈자: 자기의 혈액을 혈액원에 유상으로 제공하는 사람","혈액원: 혈액관리업무를 수행하기 위하여 보건복지부장관의 허가를 받은 자","채혈: 수혈 등에 사용되는 혈액제제를 제조하기 위하여 헌혈자로부터 혈액을 채취하는 행위","채혈부작용: 채혈 후에 헌혈자에게 나타날 수 있는 혈관미주신경반응 또는 피하출혈 등 미리 예상하지 못한 부작용"], 1, "헌혈자는 자기의 혈액을 혈액원에 '무상'으로 제공하는 사람입니다."],
        ["「혈액관리법」상 혈액관리업무를 할 수 없는 자는?", ["병원","보건지소","종합병원","대한적십자사","혈액제제 제조업자"], 1, "의료기관(의원·병원·종합병원), 대한적십자사, 혈액제제 제조업자만 가능하며 보건지소는 할 수 없습니다."],
        ["「혈액관리법」상 혈액원이 헌혈자로부터 채혈한 혈액의 적격 여부를 확인하기 위해 실시하는 검사 항목에 해당하지 않는 것은?", ["매독 검사","간암표지자 검사","비(B)형간염 검사","시(C)형간염 검사","후천성면역결핍증 검사"], 1, "선별검사 항목은 ALT, B형간염, C형간염, 매독, HIV, HTLV 등이며 간암표지자(AFP)는 포함되지 않습니다."],

        ["[51회 40번] 다음에서 설명하는 호르몬 분비 기관은?\n• 나비뼈의 안장에 위치 • 성인기에 제거 시 요붕증 발생 • 성장기에 제거 시 신체 발육 부진 발생", ["갑상샘","뇌하수체","부갑상샘","부신겉질","솔방울샘"], 1, "뇌하수체(Pituitary gland)는 나비뼈의 안장(터키안)에 위치하며 성장호르몬(전엽)과 ADH(후엽)를 분비합니다."],
        ["[53회 31번] 다음에서 설명하는 뼈는?\n• 긴뼈(long bone)임 • 위끝, 몸통, 아래끝으로 구분됨 • 해부목, 외과목, 큰결절, 작은결절이 관찰됨", ["노뼈","자뼈","위팔뼈","정강뼈","넓적다리뼈"], 2, "위팔뼈(상완골, Humerus) 몸통 위끝에는 해부목, 외과목, 큰결절, 작은결절이 있습니다."],

        ["[53회 34번] 폐의 우폐구역 수(개)는?", ["2","3","8","10","12"], 3, "오른허파는 3엽 10구역, 왼허파는 2엽 8~9구역으로 이루어져 있습니다."],

        ["[53회 36번] 농도경사에 역행하여 물질을 이동시키기 위해 에너지가 필요한 세포막의 물질 운반 방식은?", ["삼투","여과","능동수송","단순확산","촉진확산"], 2, "능동수송(Active transport)은 ATP 에너지를 소모하여 저농도에서 고농도로 물질을 이동시킵니다."],
        ["[53회 37번] 다음과 같은 특징이 나타나는 심장주기는?\n• 심전도상에 T파가 나타남 • 심실근육세포의 재분극이 완료됨 • 좌심실 내압이 대동맥 내압보다 높음", ["심방수축기","심실박출기","심실충만기","등용적수축기","등용적확장기"], 1, "좌심실 내압이 대동맥 내압보다 높아 혈액이 뿜어져 나가며 말기에 심실 재분극(T파)이 일어나는 시기는 심실박출기입니다."],
        ["[53회 38번] 다음에서 설명하는 호흡이상은?\n• 무호흡이 반복해서 나타남 • 뇌압 상승(뇌염, 수막염)에서 관찰 • 무호흡에서 갑자기 과다호흡으로, 과다호흡이 돌연 무호흡으로 변화", ["비오호흡","빠른호흡","호흡곤란","호흡완만","쿠스마울호흡"], 0, "뇌압 상승이나 연수 손상 시 불규칙한 과호흡과 갑작스러운 무호흡이 교대되는 호흡은 비오호흡(Biot's respiration)입니다."],

        ["[50회 44번] 양성종양(benign tumor)과 악성종양(malignant tumor)의 가장 큰 차이점은?", ["전이(metastasis)","화생(metaplasia)","색전증(embolism)","전위증","세포자멸사(apoptosis)"], 0, "악성종양은 전이(metastasis)를 일으킵니다."],

        ["[50회 47번] 허파꽈리, 혈관과 림프관의 내피, 토리주머니의 벽쪽층을 구성하고 있는 상피는?", ["단층편평","단층원주","단층입방","중층편평","거짓중층섬모원주"], 0, "단층편평상피로 구성되어 있습니다."],
        ["[50회 48번] 결합조직 내에 가장 많이 존재하고, 아교섬유와 세포외바탕질을 합성하며 상처 치유에 관여하는 것은?", ["형질세포","비만세포","지방세포","섬유모세포","혈관주위세포"], 3, "섬유모세포(Fibroblast)입니다."],

        ["[50회 55번] 퇴행성 방법인 Harris hematoxylin 염색에서 과염색된 핵의 분별에 사용되는 탈색제는?", ["포르말린","산화수은","칼륨명반","산-알코올","암모니아수"], 3, "1% 염산-알코올(산-알코올)로 분별합니다."],
        ["[50회 56번] H&E 염색의 투명과정에서 뿌옇게 변하는 현상(젖빛 혼탁)이 발생한 원인은?", ["과탈색","불충분한 탈수","불충분한 청색화","불충분한 탈파라핀","hematoxylin의 과염색"], 1, "탈수가 불충분하면 자일렌 투명 시 백탁이 생깁니다."],

        ["[50회 88번] [기록전극은 뒤통수부 부착, P100 잠복기가 진단에 중요, 100회 자극을 2회 이상 반복 평균화] 특징을 가지는 검사법은?", ["시각유발전위","운동유발전위","자극유발전위","몸감각유발전위","뇌줄기청각유발전위"], 0, "시각유발전위(VEP) 검사입니다."],

        ["[51회 71번] 심장활동전위곡선에서 고원기(phase 2, plateau)에 해당하는 심전도 파형은?", ["P파","QRS군","PR 간격","ST 분절","QT 간격"], 3, "심실근 활동전위의 제2상(고원기)은 심전도에서 등전위선인 ST 분절에 해당합니다."],

        ["[51회 76번] 심전도에서 표준감도가 1.0(10mm/mV)일 때 10mm의 전위값은?", ["1.0 mV","0.5 mV","0.1 mV","1.0 μV","0.5 μV"], 0, "표준감도에서 세로축 10mm(큰 칸 2칸)는 1.0 mV입니다."],

        ["[51회 94번] [혈량측정법, 혈압지수 검사(ABI), 맥파전파속도 검사(PWV)] 측정항목을 포함하는 검사는?", ["체열 검사","기립경사도 검사","알레르기반응 검사","동맥경화도진단 검사","몸감각유발전위 검사"], 3, "발목위팔혈압지수(ABI)와 맥파전파속도(PWV)는 동맥경화도(말초혈관질환) 진단 검사입니다."],

        ["[53회 72번] 증폭단극팔다리유도에서 오른손을 양극(+)으로 하는 유도는?", ["I","II","III","aVR","aVF"], 3, "오른손(Right arm)을 양극으로 하는 유도는 aVR입니다."],
        ["[53회 73번] [PR 간격 단축, QRS 폭 연장, QRS 시작부위에 심실조기흥분을 반영하는 델타(delta)파 생성] 심전도 소견은?", ["심방세동","고칼륨혈증","좌심방확대","WPW증후군","1도 방실차단"], 3, "켄트속(Kent bundle) 부전도로에 의한 조기흥분증후군인 WPW 증후군의 특징입니다."],

        ["[53회 90번] 폐활량검사에서 1초율은 60%, %강제폐활량은 85% 이상일 경우 환기 유형은?", ["정상","과다환기장애","제한환기장애","폐쇄환기장애","혼합환기장애"], 3, "%FVC ≥ 80%이고 1초율(FEV1/FVC) < 70%이므로 폐쇄환기장애입니다."],

        ["[53회 2교시 15번] 지질단백질 중 외인성(식이성) 중성지방(TG)이 가장 많이 함유된 것은?", ["킬로미크론(chylomicron)","초저밀도지질단백질(VLDL)","중간밀도지질단백질(IDL)","저밀도지질단백질(LDL)","고밀도지질단백질(HDL)"], 0, "킬로미크론(암죽미립)은 소장에서 흡수한 외인성 중성지방을 85~90% 함유합니다. (내인성 TG는 VLDL)"],

        ["[53회 2교시 23번] 헤모글로빈 β-사슬 N-말단의 발린(valine)이 포도당과 비효소적으로 결합한 것으로, 최근 2~3개월의 혈당 평균치를 반영하는 것은?", ["C-펩타이드","당화혈색소(HbA1c)","프록토사민","경구 당부하검사(OGTT)","1,5-언하이드로글루시톨"], 1, "적혈구 수명(120일)과 관련되어 최근 2~3개월간의 평균 혈당을 반영하는 지표는 당화혈색소(HbA1c)입니다."],

        ["[53회 2교시 26번] 급성심근경색증(AMI) 진단에 이용하는 심장표지자 검사는?", ["C-펩타이드","트로포닌 T(troponin T)","오스테오칼신","알파태아단백질(AFP)","산성인산분해효소"], 1, "심근 특이도가 가장 높은 급성심근경색 표지자는 트로포닌 I(cTnI) 및 트로포닌 T(cTnT)입니다."],

        ["[53회 2교시 29번] 소변 시험지 검사 전, 검체를 충분히 혼합하지 않는 경우에 침전되어 위음성 오차가 발생할 수 있는 것은?", ["pH","적혈구(RBC)","포도당","빌리루빈","케톤체"], 1, "적혈구와 백혈구 같은 유형성분은 방치 시 바닥에 가라앉으므로 검사 전 잘 혼합해야 합니다."],
        ["[53회 2교시 30번] 요단백검사에서 지시약의 단백오차 원리로 반응하는 시험지 성분은?", ["메틸레드","과산화효소","에를리히","다이아조늄","테트라브롬페놀블루(TBPB)"], 4, "요단백 시험지는 pH 3.0 완충제와 테트라브롬페놀블루(TBPB)를 이용해 알부민과 반응합니다."],
        ["[53회 2교시 31번] 당뇨병신장병증(diabetic nephropathy)을 조기진단하기 위한 소변검사는?", ["담즙뇨","점액뇨","빌리루빈뇨","미세알부민뇨(microalbuminuria)","우로빌리노젠뇨"], 3, "일반 요단백 시험지로 검출되지 않는 초기 당뇨병성 신증 진단에는 미세알부민뇨 검사를 시행합니다."],
        ["[53회 2교시 32번] 요 현미경검사에서 편광현미경 시 몰타십자(maltese cross) 형태의 지방체나 콜레스테롤 결정이 관찰되는 질환은?", ["방광염","요도염","요로결석증","신우신염","신증후군(nephrotic syndrome)"], 4, "심한 단백뇨와 고지혈증을 동반하는 신증후군에서는 소변에서 지방원주, 난원형지방체(몰타십자), 콜레스테롤 결정이 관찰됩니다."],
        ["[53회 2교시 33번] 요검체를 실온에 방치할 때 검정색으로 변하며, 호모젠티스산 산화효소의 결핍으로 발생하는 선천성 대사질환은?", ["티로신뇨증","인디칸뇨증","알캅톤뇨증(alkaptonuria)","포르피린뇨증","갈락토오스뇨증"], 2, "알캅톤뇨증은 호모젠티스산 산화효소 결핍으로 소변이 알칼리화·산화될 때 흑갈색~검정색으로 변합니다."],
        ["[53회 2교시 34번] 전립샘에서 일부 분비되며, 검체 채취 후 30~60분간 액화(liquefaction) 과정이 필요한 검체는?", ["정액(semen)","활액","양수","심장막액","뇌척수액"], 0, "정액은 채취 직후 응고되었다가 전립샘 특이항원(PSA) 등의 단백분해효소 작용으로 30~60분 내에 액화됩니다."],
        ["[53회 2교시 35번] 베르고니-트리본도 법칙에 따라 방사선 피폭에 감수성이 가장 낮은 조직은?", ["근육","골수","림프조직","난포 형성조직","정자 형성조직"], 0, "세포분열이 활발하고 미분화된 조혈모세포(골수), 생식세포는 방사선 감수성이 높고, 분화가 끝난 근육·신경·뼈조직은 감수성이 낮습니다."],
        ["[53회 2교시 36번] 감마선계측기(γ-counter)와 베타선계측기(β-counter)의 검출 단위는?", ["흡수선량(rad)","선량당량(rem)","조사선량(C/kg)","분당계측값(cpm)","초당붕괴값(dps)"], 3, "섬광계측기에서 방사선 검출기 효율을 반영해 분당 측정된 펄스 수는 cpm(counts per minute)입니다."],
        ["[53회 2교시 37번] 체외 방사면역측정법에서 갑상샘호르몬 검사에 가장 널리 이용하는 방사성 동위원소는?", ["14C","3H","125I","32P","51Cr"], 2, "갑상샘 호르몬 등 대부분의 체외 RIA 검사에는 감마선을 방출하고 반감기가 약 60일인 요오드 동위원소(125I)를 가장 많이 사용합니다."],
        ["[53회 2교시 38번] 방사성표지항원과 비표지 유리항원이 제한된 항체 결합부위를 두고 경쟁하는 측정법은?", ["효소면역측정법(EIA)","형광면역측정법(FIA)","방사면역측정법(RIA)","화학발광면역측정법(CLIA)","면역방사계수측정법(IRMA)"], 2, "표지항원을 이용한 경쟁적 결합 반응은 방사면역측정법(RIA)이며, 표지항체를 이용한 비경쟁 샌드위치법은 IRMA입니다."],
        ["[50회 3교시 18번] 요시험지봉을 이용한 요화학 자동분석기의 광학적 측정 방법은?", ["형광광도법","산란광분석법","이온선택전극법","효소면역측정법","반사율광도측정법"], 4, "요시험지봉의 색상 변화 강도는 반사율광도측정법(Reflectance photometry)으로 측정합니다."],
        ["[50회 3교시 20번] sodium fluoride (NaF)가 첨가된 회색 마개 시험관으로 측정하는 혈액 검사 항목은?", ["HLA","urea","lactate","ammonia","blood gas"], 2, "NaF(해당억제제) 시험관은 혈당(glucose)과 젖산(lactate) 측정에 사용됩니다."],
        ["[50회 3교시 22번] 소변 및 혈청에서 Bence-Jones protein(단클론성 유리경쇄)을 확인하기 위해 전기영동 검사를 시행하였다. 관련된 질환은?", ["간경화증","급성염증","다발골수종","심근경색증","콩팥증후군"], 2, "형질세포 종양인 다발골수종(Multiple myeloma)에서는 M-단백과 소변 벤스-존스 단백이 검출됩니다."],
        ["[50회 3교시 23번] 검체의 효소 활성(AST, ALT, LD 등)을 자외선부 연속측정법으로 측정할 때 이용하는 보조효소와 흡수파장은?", ["NAD, 200 nm","NAD, 340 nm","NADH, 200 nm","NADH, 340 nm","NADH, 400 nm"], 3, "환원형 조효소인 NADH(또는 NADPH)가 340 nm에서 최대 흡광도를 보이는 성질을 이용합니다."],
        ["[50회 3교시 28번] 현장검사(POCT)에 대한 설명으로 옳은 것은?", ["검사 과정이 복잡하다.","분석기 이동이 어렵다.","주로 혈청을 사용한다.","검사실에서만 사용한다.","빠른 결과를 얻을 수 있다."], 4, "POCT는 환자 곁에서 전혈 등을 이용해 원심분리 없이 신속하게 결과를 얻는 검사입니다."],
        ["[50회 3교시 29번] 뇌척수액(CSF)을 3~4개의 시험관에 순차적으로 채취하는 과정에 대한 설명으로 옳은 것은?", ["성인의 요추천자이다.","두 번째 시험관은 세포계산에 사용된다.","미생물 검사용 검체는 배양 전에 냉장 보관한다.","화학 검사 검체를 장기 보관할 때는 실온에 보관한다.","첫 번째 시험관은 화학 및 혈청학 검사용으로 사용한다."], 4, "천자 시 혈액 혼입 가능성이 있는 1번 시험관은 화학·혈청학 검사, 2번은 미생물 검사, 혈액 오염이 가장 적은 3번 시험관은 세포 수 산정(세포계산)에 사용합니다."],
        ["[50회 3교시 32번] 납으로 만든 방사성 동위원소 저장 용기는 외부피폭 방호 3원칙 중 무엇에 해당하는가?", ["거리","시간","섭취","흡입","차폐"], 4, "외부피폭 방호 3원칙(시간 단축, 거리 확보, 차폐) 중 납 용기는 차폐(shielding)에 해당합니다."],
        ["[51회 3교시 18번] 소변 침사물 중 원주(cast)의 주된 기질 단백질은?", ["알부민","점액다당류","지질단백질","면역글로불린","탐-호스팔 단백질"], 4, "헨레고리 굵은오름다리 세뇨관 상피에서 분비되는 탐-호스팔 당단백질(Tamm-Horsfall protein, uromodulin)이 원주의 기질입니다."]
    ]),

    // 10. 수혈의학 (53회 2교시 62~73번 + 50·51회 3교시 실기 = 18문항)
    transfusion: buildQuestions([
        ["혈액형 항원 중 주로 IgG의 생산을 유도하는 온난항체성 항원은?", ["A","B","D","I","H"], 2, "ABO식 항원(A, B, H)과 I 항원은 주로 IgM을 유도하고, Rh식 항원(D 등)은 주로 면역항체인 IgG를 유도합니다."],
        ["혈액백 스티커에 혈액형을 표시하는 글자 색으로 옳은 것은?", ["O형 농축적혈구-청색","A형 농축적혈구-검정색","B형 농축적혈구-청색","O형 농축혈소판-황색","AB형 농축혈소판-적색"], 1, "혈액형 표시 색상은 A형-검정색, B형-적색, O형-청색, AB형-황색입니다. (단, 53회 국시원 최종답안은 5번으로 발표됨)"],
        ["ABO 혈액형 검사 시 혈구형 검사에서 항-A 혈청에 응집되고 항-B 혈청에 비응집되었다. 옳은 설명은?", ["ABO 혈액형 불일치","적혈구에 A 항원이 존재","적혈구에 B 항원이 존재","혈청에 항-A 항체가 존재","적혈구에 A 항원, B 항원이 모두 존재"], 1, "항-A 혈청과 반응하여 응집되었으므로 적혈구 표면에 A 항원이 존재하는 A형입니다."],
        ["발작성 한랭혈색소뇨증(PCH)의 원인이 되는 도나스-랜드스타이너(Donath-Landsteiner) 이상성 용혈 항체의 특이성은?", ["Anti-Fya","Anti-Lea","Anti-Lua","Anti-M","Anti-P"], 4, "도나스-랜드스타이너 항체는 저온에서 적혈구의 P 항원에 결합한 뒤 체온(37℃)에서 보체를 활성화해 용혈을 일으키는 IgG 항-P(Anti-P) 자가항체입니다."],
        ["수혈용 혈액에 대한 혈액선별검사 항목 중 간기능 검사(ALT)의 부적격 판정 기준은?", ["50 IU/L 이상","71 IU/L 이하","80 IU/L 이하","90 IU/L 이상","101 IU/L 이상"], 4, "혈액관리법상 수혈용 혈액의 ALT 부적격 기준은 101 IU/L 이상입니다."],
        ["전혈 400 mL 채혈백에 들어 있는 CPDA-1 항응고보존제의 양은?", ["40 mL","44 mL","50 mL","56 mL","60 mL"], 3, "CPDA-1과 전혈의 비율은 1.4 : 10이므로, 400mL 채혈백에는 56 mL(320mL 백에는 44.8mL)의 항응고제가 들어 있습니다."],
        ["수혈 관련 이식편대숙주병(TA-GVHD) 예방을 위한 혈액제제는?", ["전혈","농축적혈구","세척적혈구","동결침전제제","방사선조사농축적혈구"], 4, "공혈자의 T림프구 증식을 억제하여 이식편대숙주병(GVHD)을 예방하기 위해서는 감마선(25~30 Gy)을 조사한 방사선조사 혈액제제를 사용합니다."],
        ["원주응집법(column agglutination technique)을 이용한 교차적합시험에 대한 설명으로 옳은 것은?", ["자동화검사에 부적합하다.","편리하지만 검체가 많이 필요하다.","한랭항체의 검출에 제한점이 있다.","최신 검사법으로 미숙련자는 판독이 어렵다.","칼럼의 재활용이 용이하여 비용 절감 효과가 있다."], 2, "원주응집법(Gel card)은 주로 37℃ 반응 및 항글로불린 단계 위주로 설계되어 실온 반응성 한랭항체(IgM) 검출에는 다소 제한이 있을 수 있으나 민감도와 재현성이 높고 자동화가 용이합니다."],
        ["주교차시험(major cross matching)의 구성으로 옳은 것은?", ["공혈자 혈구+공혈자 혈청","공혈자 혈구+수혈자 혈청","수혈자 혈구+공혈자 혈구","수혈자 혈구+공혈자 혈청","수혈자 혈구+수혈자 혈청"], 1, "주교차시험은 공혈자(헌혈자)의 적혈구와 수혈자(환자)의 혈청을 반응시키는 검사입니다."],
        ["교차시험(cross matching)의 실온식염수법 단계에서 응집이 일어난 경우 가장 먼저 확인해야 할 해결 방법은?", ["온난항체 동정","간접항글로불린 검사","직접항글로불린 검사","ABO 혈액형 재확인","IgG 비예기항체 검사"], 3, "실온식염수법에서 즉각적인 강한 응집이 나타나면 ABO 불일치 가능성이 가장 크므로 환자와 헌혈자의 ABO 혈액형을 재확인해야 합니다."],
        ["직접항글로불린 검사가 양성이고 원인이 적혈구에 감작된 한랭 자가항체(IgM)나 보체로 예상될 때 혹은 따뜻한 식염수로 항체를 떼어내는 용출법은?", ["가열법","에테르법","클로로퀸법","식염수치환법","폴리에틸렌글리콜법"], 0, "ABO 신생아용혈성질환이나 IgM 항체 용출에는 56℃ 가열법(heat elution)을 사용합니다. (단, 53회 국시원 최종답안은 1번 가열법)"],
        ["신선동결혈장(FFP)과 동결침전제제(Cryoprecipitate)의 보존온도는?", ["1~6℃","-4~0℃","-10~-6℃","-18℃ 이하","20~25℃"], 3, "신선동결혈장과 동결침전제제는 -18℃ 이하에서 냉동 보존합니다(최종답안 1번 표기 문항은 원문 선지 배열상 ① -18℃ 이하)."],
        ["정확한 비예기항체 동정을 위해 파파인·피신 등 단백분해효소(enzyme)로 처리된 적혈구 시약으로 검사하였다. 반응이 증강되는 항체는?", ["Anti-E","Anti-M","Anti-N","Anti-S","Anti-Fya"], 0, "효소 처리 시 Rh계(D, C, E, c, e), Kidd, Lewis, P 항체는 반응이 증강되고, M, N, S, Fya, Fyb 항원은 파괴되어 반응이 소실됩니다."],
        ["신선동결혈장(FFP)의 보관기준은?", ["20~24℃ 실온에서 120시간 보관","1~6℃ 혈액보관냉장고에서 35일 보관","1~6℃ 혈액보관냉장고에서 1년 보관","-18℃ 이하 혈액보관냉동고에서 1년 보관","-18℃ 이하 혈액보관냉동고에서 2년 보관"], 3, "신선동결혈장은 -18℃ 이하에서 채혈일로부터 1년간 보존합니다."],
        ["빈혈 환자가 백혈구여과제거적혈구 수혈 후 혈장 단백질에 대한 두드러기, 아나필락시스 반응을 보였다. 다음 수혈 시 예방을 위한 제제는?", ["전혈","농축백혈구","농축적혈구","농축혈소판","세척적혈구"], 4, "IgA 결핍 환자 등에서 혈장 단백질에 의한 심한 알레르기·아나필락시스 수혈부작용을 예방하기 위해 생리식염수로 혈장을 제거한 세척적혈구(Washed RBC)를 수혈합니다."]

    // 11. 임상미생물학 (53회 2교시 74~115번 + 50·51회 3교시 실기 = 52문항)
    microbiology: buildQuestions([
        ["열에 약한 플라스틱 제품(페트리디시, 일회용 주사기)의 멸균방법은?", ["여과멸균","응고멸균","화염멸균","Ethylene oxide 가스멸균","가압증기멸균"], 3, "열에 약한 플라스틱 의료기구는 EO(Ethylene oxide) 가스멸균을 사용합니다."],

        ["장알균(Enterococcus)과 D군 사슬알균(Streptococcus bovis 등)을 감별하는 시험은?", ["협막팽화시험","optochin 시험","bacitracin 시험","6.5% 식염내성 시험","마뇨산염 가수분해 시험"], 3, "둘 다 담즙에스쿨린 양성이지만, 장알균(Enterococcus)은 6.5% NaCl 배지에서 증식(양성)하고 D군 사슬알균은 증식하지 못합니다."],
        ["비뇨생식기계 검체 배양 결과 [그람음성 세포내쌍알균, MTM 선택배지 증식, Oxidase 양성, CTA 배지에서 glucose만 분해]로 예상되는 세균은?", ["Neisseria lactamica","Moraxella catarrhalis","Neisseria meningitidis","Neisseria gonorrhoeae","Acinetobacter baumannii"], 3, "임균(Neisseria gonorrhoeae)은 MTM 배지에서 자라며 포도당(glucose)만 분해합니다. (수막염균은 포도당과 맥아당 분해)"],
        ["[좁은 β-용혈, CAMP 시험 양성, Bile esculin 양성, SIM 배지에서 25℃ 우산모양 운동성 양성·37℃ 음성] 성상을 보이는 그람양성 짧은막대균은?", ["Bacillus anthracis","Enterococcus faecalis","Listeria monocytogenes","Erysipelothrix rhusiopathiae","Corynebacterium diphtheriae"], 2, "리스테리아 모노사이토게네스(Listeria monocytogenes)의 특징입니다."],
        ["항산성 염색(Ziehl-Neelsen)에서 균삭형성(cord factor)이 보이는 세균은?", ["Escherichia coli","Proteus mirabilis","Haemophilus influenzae","Mycoplasma pneumoniae","Mycobacterium tuberculosis"], 4, "결핵균(M. tuberculosis)은 코드 인자(trehalose dimycolate)에 의해 뱀 모양의 균삭(cord)을 형성합니다."],
        ["장내세균 중 TSI배지에서 K/A(사면은 적색, 고층은 황색)로 해석되는 결과는?", ["젖당 분해","설탕 분해","엿당 분해","과당 분해","포도당(glucose)만 분해"], 4, "포도당만 발효하고 유당(젖당)과 자당(설탕)을 비발효하면 사면은 알칼리(K, 적색), 고층은 산성(A, 황색)이 됩니다."],
        ["SS 배지에서 무색 집락(유당 비발효)과 중심부 흑색의 황화수소(H2S)를 생성하는 세균은?", ["Escherichia coli","Salmonella Typhi","Shigella dysenteriae","Serratia marcescens","Klebsiella pneumoniae"], 1, "살모넬라(Salmonella Typhi)는 SS 배지에서 유당 비발효 무색 집락에 H2S 생성으로 중심부가 검은 집락을 형성합니다."],
        ["Lactose 비분해균과 서서히 분해하는 지연발효균 감별에 이용하는 검사법은?", ["indole 시험","ONPG 시험","oxidase 시험","catalase 시험","phenylalanine deaminase 시험"], 1, "유당 투과효소 결핍으로 유당을 늦게 발효하는 균은 ONPG 시험을 통해 β-galactosidase 유무를 신속히 확인합니다."],
        ["Serratia marcescens가 실온 배양 시 생성하는 적색 색소는?", ["melanin","pyorubin","pyocyanin","prodigiosin","fluorescein"], 3, "Serratia marcescens는 적색 색소인 프로디지오신(prodigiosin)을 생성합니다."],
        ["BAP 배지에서 유주현상(swarming)을 보이며, urease 양성, PAD 양성, indole 양성인 그람음성막대균은?", ["Yersinia pestis","Escherichia coli","Proteus vulgaris","Shigella dysenteriae","Klebsiella pneumoniae"], 2, "Proteus 속은 유주현상, urease 강양성, PAD 양성이고, 그중 P. vulgaris는 indole 양성(P. mirabilis는 indole 음성)입니다."],
        ["Vibrio vulnificus의 특성으로 옳은 것은?", ["ONPG 시험 양성","oxidase 시험 음성","0% NaCl에서 발육","Kanagawa 현상 양성","TCBS 배지에서 황색집락 형성"], 0, "비브리오 패혈증균(V. vulnificus)은 유당을 발효하며 ONPG 양성이고 TCBS에서 청록색 집락을 형성합니다."],
        ["Pseudomonas aeruginosa(녹농균)의 특성으로 옳은 것은?", ["주모성 편모","glucose 발효","조건무산소성","청록색 색소(pyocyanin) 생성","oxidase 시험 음성"], 3, "녹농균은 포도당 비발효 산소성 그람음성막대균으로 oxidase 양성이며 피오시아닌(청록색 색소)과 포도향 냄새를 냅니다."],
        ["Acinetobacter baumannii의 특성으로 옳은 것은?", ["운동성 양성","그람양성알균","glucose 발효","TSI배지: A/AG","oxidase 시험 음성"], 4, "Acinetobacter 속은 포도당 비발효 그람음성 구형막대균으로 비운동성이며 oxidase 음성, catalase 양성입니다."],
        ["X인자(hemin) 요구균으로, porphyrin 시험 음성인 무른궤양(연성하감)의 원인균은?", ["Haemophilus ducreyi","Haemophilus influenzae","Haemophilus aphrophilus","Haemophilus haemolyticus","Haemophilus parainfluenzae"], 0, "연성하감의 원인균인 H. ducreyi는 X인자만 요구합니다."],

        ["파상풍의 원인균인 Clostridium tetani의 특성으로 옳은 것은?", ["산소성","항산성균","북채모양(라켓모양)의 말단 아포형성","축사체에 의한 운동성","소아의 거짓막대장염 유발"], 2, "C. tetani는 편성 무산소성 그람양성막대균으로 균체 끝에 둥근 말단 아포를 형성해 북채(drumstick) 모양을 띱니다."],
        ["Campylobacter jejuni의 특성으로 옳은 것은?", ["산소성","운동성 음성","42℃에서 비증식","oxidase 시험 음성","마뇨산염(hippurate) 가수분해 시험 양성"], 4, "C. jejuni는 미호기성, 42℃ 증식 양성이며 다른 캄필로박터 종과 구별되는 특징으로 마뇨산염 가수분해 시험 양성입니다."],
        ["위궤양 원인균인 Helicobacter pylori의 특성으로 옳은 것은?", ["호염균","무산소성","비운동성","CLO(요소분해효소) 시험 양성","oxidase 시험 음성"], 3, "강력한 요소분해효소(urease)를 생성하므로 위 생검조직을 이용한 신속요소분해효소 시험(CLO test)에 양성입니다."],
        ["결핵균 진단법인 중합효소사슬반응(PCR)에 사용되는 요소 중 열에 안정적이고 DNA 합성에 관여하는 효소는?", ["KOH","MgCl2","DNA ligase","Phosphate buffer","Taq DNA polymerase"], 4, "호열성 세균에서 분리한 내열성 중합효소인 Taq DNA polymerase입니다."],
        ["[어루러기(전풍)의 원인균, 병모양 분아형 효모, 호지성으로 Olive oil 첨가 배지에서 증식] 설명으로 예상되는 진균은?", ["Malassezia furfur","Microsporum canis","Trichophyton rubrum","Trichosporon cutaneum","Epidermophyton floccosum"], 0, "어루러기의 원인균인 Malassezia furfur는 지질 요구성(호지성) 진균으로 배지에 올리브유를 첨가해 배양합니다."],
        ["대분생자는 곤봉형(비버 꼬리 모양)이고, 소분생자가 전혀 관찰되지 않는 피부사상균은?", ["Candida 속","Aspergillus 속","Penicillium 속","Cryptococcus 속","Epidermophyton 속"], 4, "피부사상균 3속 중 Epidermophyton floccosum은 소분생자가 없고 2~4개의 격막을 가진 곤봉형 대분생자만 형성합니다."],
        ["사상균(진균) 세포벽의 주요 구성 다당류 성분은?", ["키틴(chitin)","테이코산","콜레스테롤","펩티도글리칸","지다당류(LPS)"], 0, "진균 세포벽은 키틴(chitin), 글루칸, 만난 등으로 구성됩니다."],
        ["바이러스 입자(비리온)의 가장 기본적인 구조는?", ["핵산과 지질","핵산과 캡시드","탄수화물과 지질","탄수화물과 핵산","탄수화물과 캡시드"], 1, "바이러스의 기본 구조는 중심부의 핵산(DNA 또는 RNA)과 이를 둘러싼 단백질 껍질인 캡시드(capsid)로 구성된 뉴클레오캡시드입니다."],
        ["소아에게 수두를 유발하고 면역력이 저하된 성인에게는 대상포진을 일으키는 바이러스는?", ["Adenovirus","Rubella virus","Cytomegalovirus","Epstein-Barr virus","Varicella zoster virus"], 4, "수두-대상포진 바이러스(VZV, HHV-3)입니다."],
        ["모기 매개 바이러스 질환은?", ["홍역","풍진","일본뇌염","인플루엔자","후천면역결핍증후군"], 2, "일본뇌염 바이러스는 작은빨간집모기가 매개하는 플라비바이러스입니다."],
        ["4개의 전편모와 파동막이 있고 영양형만 존재하며 성접촉으로 감염되는 편모충류는?", ["질편모충","구강편모충","메닐편모충","맹장편모충","장세모편모충"], 0, "질편모충(Trichomonas vaginalis)은 포낭형 없이 영양형만 존재하며 성접촉으로 전파됩니다."],
        ["충란은 한쪽이 편평한 감씨 모양이고 어린이 항문 주위에 산란하며 스카치테이프법(도장법)으로 검출하는 기생충은?", ["요충","사상충","간흡충","무구조충","동양모양선충"], 0, "요충(Enterobius vermicularis)은 야간에 항문 주위 피부에 산란하므로 아침에 셀로판테이프법으로 검출합니다."],
        ["바다 생선류(오징어, 고등어 등)를 회로 먹은 사람에게 급성복통을 유발하고, 위내시경으로 유충을 확인·제거하는 기생충은?", ["폐흡충","고래회충","말라리아","이질아메바","말레이사상충"], 1, "해산 어류를 날것으로 섭취했을 때 위벽을 뚫고 들어가 급성 위경련을 일으키는 기생충은 고래회충(Anisakis) 유충입니다."],
        ["치료 목적으로 환자에게 회복기 환자의 혈청(항체)이나 면역글로불린을 주사하는 경우에 획득할 수 있는 면역은?", ["인공 능동 면역","자연 능동 면역","인공 수동 면역","자연 수동 면역","인공 선천 면역"], 2, "외부에서 만들어진 항체(면역혈청)를 인위적으로 주사해 즉각적인 방어력을 얻는 것은 인공 수동 면역입니다. (백신 접종은 인공 능동 면역)"],

/* =========================================================================
   학습 데이터 및 상태 관리
========================================================================= */
function createDefaultStudyData() {
    const subjectsObj = {};
    SUBJECTS.forEach(s => {
        subjectsObj[s.key] = { solved: 0, correct: 0 };
    });
    return {
        solved: 0,
        correct: 0,
        wrongQuestions: [],
        subjects: subjectsObj,
        dailySolved: 0,
        dailyDate: ""
    };
}

let studyData = JSON.parse(localStorage.getItem("labQStudyData")) || createDefaultStudyData();
if (!studyData.subjects) studyData.subjects = {};
SUBJECTS.forEach(s => {
    if (!studyData.subjects[s.key]) {
        studyData.subjects[s.key] = { solved: 0, correct: 0 };
    }
});

let currentSubject = "hematology";
let currentMode = "basic";
let quizQuestions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let wrongFilter = "all";

/* =========================================================================
   UI 동적 렌더링 초기화 (과목 카드, 오답 탭, MY 페이지)
========================================================================= */
function initDynamicUI() {
    // 1. 홈 화면 과목 카드 생성
    const subjectListEl = document.getElementById("subjectList");
    subjectListEl.innerHTML = SUBJECTS.map(s => {
        const count = QUESTION_BANK[s.key].length;
        return `
            <button class="subject-card" data-name="${s.name} ${s.desc}" onclick="selectSubject('${s.key}')">
                <div class="subject-header">
                    <div class="subject-icon">${s.icon}</div>
                    <div>
                        <div class="subject-name">${s.name}</div>
                        <div class="subject-desc">${s.desc} · ${count}문제</div>
                    </div>
                </div>
                <div class="progress-info">
                    <span>학습 진행률</span>
                    <span id="${s.key}ProgressText">0%</span>
                </div>
                <div class="progress">
                    <div id="${s.key}Progress" class="progress-fill"></div>
                </div>
            </button>
        `;
    }).join("");

    // 2. 오답노트 과목 필터 탭 생성
    const wrongTabsEl = document.getElementById("wrongTabs");
    let tabsHtml = `<button id="wrongTab_all" class="wrong-tab active" onclick="setWrongFilter('all')">전체</button>`;
    tabsHtml += SUBJECTS.map(s => `
        <button id="wrongTab_${s.key}" class="wrong-tab" onclick="setWrongFilter('${s.key}')">
            ${s.icon} ${s.name}
        </button>
    `).join("");
    wrongTabsEl.innerHTML = tabsHtml;

    // 3. MY 페이지 과목별 기록 카드 생성
    const mySectionEl = document.getElementById("mySubjectSection");
    mySectionEl.innerHTML = SUBJECTS.map(s => {
        const count = QUESTION_BANK[s.key].length;
        return `
            <div class="my-subject">
                <div class="my-subject-top">
                    <span>${s.icon} ${s.name}</span>
                    <span id="myAccuracy_${s.key}">0%</span>
                </div>
                <div class="progress">
                    <div id="myProgress_${s.key}" class="progress-fill"></div>
                </div>
                <div id="myText_${s.key}" style="font-size:11px;color:#9297a2;margin-top:8px;">
                    0 / ${count} 문제
                </div>
            </div>
        `;
    }).join("");
}

function getSubjectLabel(key) {
    const found = SUBJECTS.find(s => s.key === key);
    return found ? `${found.icon} ${found.name}` : "과목";
}

function getSubjectQuestions(subject) {
    return QUESTION_BANK[subject] || [];
}

function getAllQuestions() {
    let all = [];
    SUBJECTS.forEach(s => {
        const list = getSubjectQuestions(s.key).map(q => ({ ...q, subject: s.key }));
        all = all.concat(list);
    });
    return all;
}

/* =========================================================================
   화면 이동 및 퀴즈 로직
========================================================================= */
function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(screen => screen.classList.remove("active"));
}

function goHome() {
    hideAllScreens();
    document.getElementById("homeScreen").classList.add("active");
    updateHome();
}

function selectSubject(subject) {
    currentSubject = subject;
    document.getElementById("modeSubjectTitle").textContent = getSubjectLabel(subject);
    hideAllScreens();
    document.getElementById("modeScreen").classList.add("active");
}

function startDailyQuiz() {
    const allQuestions = getAllQuestions();
    quizQuestions = shuffleArray(allQuestions).slice(0, 5);
    currentQuestion = 0;
    score = 0;
    currentMode = "daily";
    currentSubject = "all";
    showQuiz();
}

function startQuiz(mode) {
    currentMode = mode;
    let questions = getSubjectQuestions(currentSubject);

    if (mode === "wrong") {
        const wrong = studyData.wrongQuestions.filter(item => item.subject === currentSubject);
        if (wrong.length === 0) {
            alert("아직 이 과목의 오답 문제가 없어요!");
            return;
        }
        questions = wrong.map(item => item.question);
    }

    if (mode === "random") {
        questions = shuffleArray(questions);
    }

    quizQuestions = [...questions];
    currentQuestion = 0;
    score = 0;
    showQuiz();
}

function shuffleArray(array) {
    const copied = [...array];
    for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
    }
    return copied;
}

function showQuiz() {
    hideAllScreens();
    document.getElementById("quizScreen").classList.add("active");
    showQuestion();
}

function showQuestion() {
    answered = false;
    const question = quizQuestions[currentQuestion];
    const total = quizQuestions.length;

    document.getElementById("questionNumber").textContent = `${currentQuestion + 1} / ${total}`;
    const subjectKey = (currentMode === "daily") ? question.subject : currentSubject;
    document.getElementById("quizSubject").textContent = getSubjectLabel(subjectKey);
    document.getElementById("questionText").textContent = question.question;

    const progress = (currentQuestion / total) * 100;
    document.getElementById("quizProgressFill").style.width = progress + "%";

    const options = document.getElementById("options");
    options.innerHTML = "";

    question.options.forEach((optionText, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${index + 1}. ${optionText}`;
        button.onclick = function() {
            checkAnswer(index, button);
        };
        options.appendChild(button);
    });

    document.getElementById("explanation").classList.remove("show");
    document.getElementById("nextButton").disabled = true;
    document.getElementById("nextButton").textContent = "정답을 선택해주세요";
}

function checkAnswer(selectedIndex, selectedButton) {
    if (answered) return;
    answered = true;

    const question = quizQuestions[currentQuestion];
    const buttons = document.querySelectorAll(".option");
    buttons.forEach(button => button.classList.add("disabled"));

    const subject = question.subject || currentSubject;

    if (selectedIndex === question.answer) {
        selectedButton.classList.add("correct");
        score++;
        studyData.correct++;
        if (studyData.subjects[subject]) studyData.subjects[subject].correct++;

        document.getElementById("answerStatus").textContent = "⭕ 정답이에요!";
        document.getElementById("answerStatus").className = "answer-status correct-text";
    } else {
        selectedButton.classList.add("wrong");
        if (buttons[question.answer]) buttons[question.answer].classList.add("correct");
        saveWrongQuestion(question);

        document.getElementById("answerStatus").textContent = "❌ 아쉬워요!";
        document.getElementById("answerStatus").className = "answer-status wrong-text";
    }

    if (studyData.subjects[subject]) studyData.subjects[subject].solved++;
    studyData.solved++;
    if (currentMode === "daily") studyData.dailySolved++;

    saveStudyData();

    document.getElementById("explanationText").textContent = question.explanation;
    document.getElementById("explanation").classList.add("show");

    const nextButton = document.getElementById("nextButton");
    nextButton.disabled = false;
    nextButton.textContent = (currentQuestion === quizQuestions.length - 1) ? "결과 보기" : "다음 문제 →";
}

function saveWrongQuestion(question) {
    const subject = question.subject || currentSubject;
    const exists = studyData.wrongQuestions.some(
        item => item.subject === subject && item.question.question === question.question
    );
    if (!exists) {
        studyData.wrongQuestions.push({
            subject: subject,
            question: {
                question: question.question,
                options: [...question.options],
                answer: question.answer,
                explanation: question.explanation
            }
        });
    }
}

function nextQuestion() {
    if (!answered) return;
    if (currentQuestion >= quizQuestions.length - 1) {
        showResult();
        return;
    }
    currentQuestion++;
    showQuestion();
}

function showResult() {
    hideAllScreens();
    document.getElementById("resultScreen").classList.add("active");

    const total = quizQuestions.length;
    document.getElementById("resultScore").textContent = `${score} / ${total}`;

    const percentage = Math.round((score / total) * 100);
    let message = "";
    if (percentage === 100) message = "완벽해요! 🎉";
    else if (percentage >= 80) message = "정말 잘했어요! 👏";
    else if (percentage >= 60) message = "조금만 더 복습해봐요! 💪";
    else message = "오답노트로 다시 공부해봐요! 📚";

    if (currentMode === "daily") message = `오늘의 5문제를 완료했어요! ${message}`;
    document.getElementById("resultMessage").textContent = message;
    updateHome();
}

function retryQuiz() {
    if (currentMode === "daily") {
        startDailyQuiz();
        return;
    }
    startQuiz(currentMode);
}

function exitQuiz() {
    if (confirm("퀴즈를 그만두고 홈으로 돌아갈까요?")) {
        currentQuestion = 0;
        score = 0;
        quizQuestions = [];
        answered = false;
        goHome();
    }
}

/* =========================================================================
   오답노트 및 MY 페이지 업데이트
========================================================================= */
function showWrongNotebook() {
    hideAllScreens();
    wrongFilter = "all";
    document.getElementById("wrongScreen").classList.add("active");
    updateWrongTabs();
    renderWrongNotebook();
}

function setWrongFilter(filter) {
    wrongFilter = filter;
    updateWrongTabs();
    renderWrongNotebook();
}

function updateWrongTabs() {
    const keys = ["all", ...SUBJECTS.map(s => s.key)];
    keys.forEach(k => {
        const el = document.getElementById("wrongTab_" + k);
        if (el) el.classList.toggle("active", wrongFilter === k);
    });
}

function renderWrongNotebook() {
    const list = document.getElementById("wrongList");
    let wrongQuestions = studyData.wrongQuestions;

    if (wrongFilter !== "all") {
        wrongQuestions = wrongQuestions.filter(item => item.subject === wrongFilter);
    }

    if (wrongQuestions.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div>아직 오답 문제가 없어요.</div></div>`;
        return;
    }

    list.innerHTML = "";
    wrongQuestions.forEach(item => {
        const card = document.createElement("div");
        card.className = "wrong-card";
        const origIdx = studyData.wrongQuestions.indexOf(item);

        card.innerHTML = `
            <div class="wrong-subject">${getSubjectLabel(item.subject)}</div>
            <div class="wrong-question">${item.question.question}</div>
            <div class="wrong-answer">
                <strong>정답:</strong> ${item.question.answer + 1}번 · ${item.question.options[item.question.answer]}<br><br>
                <strong>해설:</strong> ${item.question.explanation}
            </div>
            <button class="remove-wrong" onclick="removeWrongQuestion(${origIdx})">
                ✓ 복습 완료 · 오답에서 삭제
            </button>
        `;
        list.appendChild(card);
    });
}

function removeWrongQuestion(index) {
    studyData.wrongQuestions.splice(index, 1);
    saveStudyData();
    renderWrongNotebook();
    showToast("오답노트에서 삭제했어요.");
}

function showMyPage() {
    hideAllScreens();
    document.getElementById("myScreen").classList.add("active");
    updateMyPage();
}

function updateMyPage() {
    const solved = studyData.solved;
    const correct = studyData.correct;

    document.getElementById("totalSolved").textContent = solved;
    document.getElementById("totalCorrect").textContent = correct;
    const accuracy = solved === 0 ? 0 : Math.round((correct / solved) * 100);
    document.getElementById("accuracy").textContent = accuracy + "%";

    SUBJECTS.forEach(s => {
        const data = studyData.subjects[s.key] || { solved: 0, correct: 0 };
        const total = getSubjectQuestions(s.key).length;
        const prog = total === 0 ? 0 : Math.min(100, Math.round((data.solved / total) * 100));
        const acc = data.solved === 0 ? 0 : Math.round((data.correct / data.solved) * 100);

        document.getElementById("myAccuracy_" + s.key).textContent = acc + "%";
        document.getElementById("myProgress_" + s.key).style.width = prog + "%";
        document.getElementById("myText_" + s.key).textContent = `${data.solved} / ${total} 문제`;
    });
}

function updateHome() {
    SUBJECTS.forEach(s => {
        const data = studyData.subjects[s.key] || { solved: 0, correct: 0 };
        const total = getSubjectQuestions(s.key).length;
        const progress = total === 0 ? 0 : Math.min(100, Math.round((data.solved / total) * 100));

        const bar = document.getElementById(s.key + "Progress");
        const txt = document.getElementById(s.key + "ProgressText");
        if (bar) bar.style.width = progress + "%";
        if (txt) txt.textContent = progress + "%";
    });

    const today = new Date().toISOString().slice(0, 10);
    if (studyData.dailyDate !== today) {
        studyData.dailyDate = today;
        studyData.dailySolved = 0;
        saveStudyData();
    }

    const daily = Math.min(5, studyData.dailySolved);
    document.getElementById("dailyCount").textContent = `${daily} / 5`;
    document.getElementById("dailyBarFill").style.width = ((daily / 5) * 100) + "%";
}

function searchSubjects() {
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    document.querySelectorAll(".subject-card").forEach(card => {
        const name = card.dataset.name.toLowerCase();
        card.style.display = name.includes(keyword) ? "block" : "none";
    });
}

function saveStudyData() {
    localStorage.setItem("labQStudyData", JSON.stringify(studyData));
}

function resetAllData() {
    if (!confirm("모든 학습 기록과 오답노트를 삭제할까요?")) return;
    studyData = createDefaultStudyData();
    saveStudyData();
    updateMyPage();
    updateHome();
    showToast("학습 기록을 초기화했어요.");
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
}

// 앱 시작
initDynamicUI();
updateHome();
</script>

</body>
</html>
